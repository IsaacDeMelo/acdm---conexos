<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACDM - Acess Code</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== CORES EXATAS DO PROTÓTIPO ==================== */
        :root {
            --bg-deep: #0a0510; 
            
            /* Inputs */
            --input-bg: #3a2e42; 
            --input-placeholder: #8a7b92;
            
            /* Novas Cores Desta Tela (Roxo/Violeta) */
            --line-purple: #46225e;  /* Roxo escuro da linha */
            --btn-purple: #7a3ee8;   /* Violeta brilhante do botão */
            
            /* Textos Gerais */
            --text-white: #ffffff;
            --text-gold: #bda15f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fundo Responsivo para PC e Mobile */
        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-deep);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            padding-top: 20vh; /* Mantido o mesmo posicionamento elevado */
            align-items: center;
            color: var(--text-white);
        }

        /* ==================== CONTAINER PRINCIPAL ==================== */
        .main-container {
            width: 100%;
            max-width: 400px; /* Trava no PC, expande no Celular */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px;
        }

        /* ==================== BLOCO DA LOGO (TOPO) ==================== */
        .brand-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 50px; /* Espaçamento até o formulário */
        }

        .logo-icon {
            height: 65px;
            width: auto;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-gold);
            font-weight: 600;
        }

        /* ==================== BLOCO DO FORMULÁRIO ==================== */
        .login-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .purple-line {
            width: 85%;
            height: 2px;
            background-color: var(--line-purple);
            border-radius: 2px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .input-pill {
            width: 100%;
            height: 44px;
            background-color: var(--input-bg);
            border: none;
            border-radius: 25px;
            padding: 0 22px;
            color: var(--text-white);
            font-size: 0.75rem;
            font-weight: 500;
            outline: none;
            transition: background-color 0.3s;
        }

        .input-pill:focus {
            background-color: #493b54;
        }

        .input-pill::placeholder {
            color: var(--input-placeholder);
        }

        /* ==================== BOTÃO ROXO ==================== */
        .btn-submit {
            background-color: var(--btn-purple);
            color: var(--text-white);
            border: none;
            border-radius: 25px;
            height: 35px;
            padding: 0 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            
            /* Centraliza e deixa o botão mais estreito */
            width: 100%;
            max-width: 200px; /* Um pouco mais estreito, igual à imagem */
            margin: 15px auto 0 auto; 
            display: block;
            
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.03);
        }

        .btn-submit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

    </style>
</head>

<body>

    <main class="main-container">
        
        <!-- BLOCO SUPERIOR (LOGO E TEXTOS) -->
        <div class="brand-group">
            <img src="src/logo_grande.png" alt="Logo Academy" class="logo-icon">
            <h1 class="brand-title">Instituto Academy Alquirves</h1>
            <p class="brand-subtitle">Olá membro!</p>
        </div>

        <!-- BLOCO INFERIOR (FORMULÁRIO) -->
        <div class="login-section">
            <h2 class="form-title">Acess Code</h2>
            <div class="purple-line"></div> <!-- Linha agora é roxa -->

            <form action="#" method="POST">
                <!-- Único Input -->
                <input type="text" class="input-pill" placeholder="Código de confirmação enviado pelo WhatsApp" id="acess-code">
                
                <!-- Botão agora é Violeta -->
                <button type="submit" class="btn-submit" id="btn-code">Acessar</button>
            </form>
        </div>

    </main>

</body>
</html>
