<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACDM - Acess Alquirves</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== CORES EXATAS DO PROTÓTIPO ==================== */
        :root {
            --bg-deep: #0a0510; 
            
            /* Inputs e Botões */
            --input-bg: #3a2e42; 
            --input-placeholder: #8a7b92;
            --btn-red: #9e3c3c;
            --line-red: #b83b3b;
            
            /* Textos Gerais */
            --text-white: #ffffff;
            --text-gold: #bda15f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fundo Responsivo para PC e Mobile */
        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-deep);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            
            /* ======================================================== */
            /* CORREÇÃO DO POSICIONAMENTO: Deixa o bloco mais para cima */
            /* ======================================================== */
            justify-content: flex-start; 
            padding-top: 20vh; /* Empurra do teto pra baixo. Diminua se quiser mais alto ainda */
            
            align-items: center;
            color: var(--text-white);
        }

        /* ==================== CONTAINER PRINCIPAL ==================== */
        .main-container {
            width: 100%;
            max-width: 400px; /* Trava no PC, expande no Celular */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px;
        }

        /* ==================== BLOCO DA LOGO (TOPO) ==================== */
        .brand-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 50px; /* Espaçamento grande até o formulário */
        }

        .logo-icon {
            height: 65px;
            width: auto;
            object-fit: contain;
            margin-bottom: 15px;
            /* Filtro opcional para destacar um pouco mais a logo no fundo escuro */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-gold);
            font-weight: 600;
        }

        /* ==================== BLOCO DO FORMULÁRIO ==================== */
        .login-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .red-line {
            width: 85%;
            height: 2px;
            background-color: var(--line-red);
            border-radius: 2px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .input-pill {
            width: 100%;
            height: 44px;
            background-color: var(--input-bg);
            border: none;
            border-radius: 25px;
            padding: 0 22px;
            color: var(--text-white);
            font-size: 0.75rem;
            font-weight: 500;
            outline: none;
            transition: background-color 0.3s;
        }

        .input-pill:focus {
            background-color: #493b54;
        }

        .input-pill::placeholder {
            color: var(--input-placeholder);
        }

        /* ==================== BOTÃO VERMELHO ==================== */
        .btn-submit {
            background-color: var(--btn-red);
            color: var(--text-white);
            border: none;
            border-radius: 25px;
            height: 42px;
            padding: 0 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            
            /* Centraliza e deixa o botão mais estreito que os inputs */
            width: 100%;
            max-width: 220px;
            margin: 15px auto 0 auto; 
            display: block;
            
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.03);
        }

        .btn-submit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* ==================== ALERTA ==================== */
        .alerta {
            display: none;
            background-color: #3a1010;
            border: 1px solid #833;
            color: #e66;
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

    </style>
</head>

<body>

    <main class="main-container">
        
        <!-- BLOCO SUPERIOR (LOGO E TEXTOS) -->
        <div class="brand-group">
            <img src="src/logo_grande.png" alt="Logo Academy" class="logo-icon">
            <h1 class="brand-title">Instituto Academy Alquirves</h1>
            <p class="brand-subtitle">Olá membro!</p>
        </div>

        <!-- BLOCO INFERIOR (FORMULÁRIO) -->
        <div class="login-section">
            <h2 class="form-title">Acess Alquirves</h2>
            <div class="red-line"></div>

            <div id="alerta" class="alerta"></div>

            <form action="#" method="POST" id="form-acess">
                <input type="text" class="input-pill" placeholder="ACDM ID" id="acess-id" autocomplete="username">
                <input type="password" class="input-pill" placeholder="Senha" id="acess-senha" autocomplete="current-password">
                
                <button type="submit" class="btn-submit" id="btn-acess">Acessar ou Cadastrar</button>
            </form>
        </div>

    </main>

    <script>
        var alertaEl = document.getElementById('alerta');

        function mostrarAlerta(msg) {
            alertaEl.textContent = msg;
            alertaEl.style.display = 'block';
        }

        if (localStorage.getItem('alquirves_session')) {
            fetch('/alrquives/me')
                .then(function (r) {
                    if (r.ok) {
                        window.location.href = '/alrquives/home';
                    } else {
                        localStorage.removeItem('alquirves_session');
                    }
                })
                .catch(function () {});
        }

        document.getElementById('form-acess').addEventListener('submit', async function (e) {
            e.preventDefault();

            var btn = document.getElementById('btn-acess');
            var id = document.getElementById('acess-id').value.trim();
            var senha = document.getElementById('acess-senha').value;

            if (!id) { mostrarAlerta('Informe o seu ACDM ID.'); return; }
            if (!senha || senha.length < 4) { mostrarAlerta('A senha deve ter no minimo 4 caracteres.'); return; }

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                var res = await fetch('/alrquives/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, senha: senha })
                });
                var data = await res.json();

                if (!res.ok) {
                    mostrarAlerta(data.error || 'Erro ao acessar.');
                    btn.disabled = false;
                    btn.textContent = 'Acessar ou Cadastrar';
                    return;
                }

                localStorage.setItem('alquirves_acdm', id.toUpperCase());
                window.location.href = '/alrquives/code.html';
            } catch (err) {
                mostrarAlerta('Erro de conexao. Tente novamente.');
                btn.disabled = false;
                btn.textContent = 'Acessar ou Cadastrar';
            }
        });
    </script>

</body>
</html>
